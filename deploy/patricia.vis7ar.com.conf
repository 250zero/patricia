# Virtual Host Nginx para Patricia en Visar (0 Docker)
# Dominio Frontend PWA: patricia.vis7ar.com
# Dominio API Backend: api.patricia.vis7ar.com

# 1. Frontend PWA Angular (patricia.vis7ar.com)
server {
    listen 80;
    listen [::]:80;
    server_name patricia.vis7ar.com;

    root /var/www/patricia.vis7ar.com/dist/patricia/browser;
    index index.html;

    # Limite maximo de subida de comprobantes fotograficos de camaras de celular
    client_max_body_size 10M;

    # Compresion Gzip para optimizar velocidad de carga en red movil
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache agresivo para estaticos versionados
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Proxy inverso transparente a API Deno (puerto 3002)
    location /api/ {
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enrutamiento SPA Angular (HTML5 pushState)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. Subdominio dedicado API Backend (api.patricia.vis7ar.com)
server {
    listen 80;
    listen [::]:80;
    server_name api.patricia.vis7ar.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
